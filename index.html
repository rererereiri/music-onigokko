<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音楽おにごっこ</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5;pointer-events:none}
.badge{background:#20242b;color:#fff;border-radius:13px;padding:8px 12px;font-weight:800}
#oniInfo{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:5;background:#b62525;color:#fff;padding:7px 12px;border-radius:13px;font-weight:800;white-space:nowrap}
#start{position:fixed;inset:0;background:rgba(15,25,45,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:white;border-radius:24px;padding:24px;text-align:center;max-width:480px;width:100%;box-shadow:0 15px 50px #0005}
.card h1{margin:0 0 10px;font-size:32px}.card p{line-height:1.65;margin:8px 0 18px}
#play,#restart{border:0;border-radius:18px;background:#5d76ff;color:white;font-size:20px;font-weight:900;padding:16px 28px}
#joy{position:fixed;left:22px;bottom:25px;width:135px;height:135px;border:2px solid #ffffff99;border-radius:50%;background:#ffffff25;z-index:8}
#stick{position:absolute;left:39px;top:39px;width:57px;height:57px;border-radius:50%;background:#ffffffe6}
#jump{position:fixed;right:25px;bottom:35px;width:105px;height:105px;border:0;border-radius:50%;background:#ffd24d;color:#2861c9;font-size:18px;font-weight:900;z-index:8}
#msg{position:fixed;top:105px;left:50%;transform:translateX(-50%);z-index:9;font-size:24px;font-weight:1000;color:#fff;text-shadow:0 2px 5px #000;pointer-events:none}
#info{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;background:#0008;padding:4px 10px;border-radius:10px;z-index:5;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="badge">⏰ <span id="time">300</span></div><div class="badge">❤️ <span id="life">3</span></div><div class="badge">⭐ <span id="score">0</span></div></div>
<div id="oniInfo">👹 鬼は10秒後にスタート！</div>
<div id="msg"></div>
<div id="start"><div class="card"><h1>🎵 音楽おにごっこ 👹</h1><p>鬼は最初から見える場所にいます。<br><b>10秒間の逃げ時間</b>のあと追いかけてきます！<br>⭐を集めながら5分間逃げ切ろう。<br><br>スタートを押すとBGMも始まります。</p><button id="play">ゲームスタート</button></div></div>
<div id="joy"><div id="stick"></div></div>
<button id="jump">JUMP</button>
<div id="info">iPad：左スティック＋JUMP　PC：WASD / 矢印キー＋Space</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,dpr=1; function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

let running=false,last=0,elapsed=0,life=3,score=0,inv=0;
const player={x:0,z:2,y:0,vy:0}, oni={x:0,z:18}, stars=[];
const keys={}, joy={x:0,y:0};
const timeEl=document.getElementById('time'),lifeEl=document.getElementById('life'),scoreEl=document.getElementById('score'),oniInfo=document.getElementById('oniInfo'),msg=document.getElementById('msg');

function resetPositions(){player.x=0;player.z=2;player.y=0;player.vy=0;oni.x=0;oni.z=18}
function makeStars(){stars.length=0;for(let i=0;i<24;i++)stars.push({x:(Math.random()-.5)*26,z:7+Math.random()*65,got:false})}
makeStars();

let ac=null, master=null, musicTimer=null, step=0;
function audioStart(){
  ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain();master.gain.value=.16;master.connect(ac.destination);
  const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];
  function tick(){if(!running)return; const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=notes[step++%notes.length];g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+.23)}
  tick();musicTimer=setInterval(tick,260);
}
function sfx(freq=700,d=.12,type='sine'){if(!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+d)}
function flash(t){msg.textContent=t;setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},900)}

document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';running=true;elapsed=0;life=3;score=0;resetPositions();makeStars();audioStart();last=performance.now();requestAnimationFrame(loop)};
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function jump(){if(player.y<.02){player.vy=8.2;sfx(520,.1,'square')}}

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
function joyMove(e){const r=joyEl.getBoundingClientRect(),px=e.clientX-(r.left+r.width/2),py=e.clientY-(r.top+r.height/2),m=Math.hypot(px,py)||1,k=Math.min(1,55/m);joy.x=px/55*k;joy.y=py/55*k;stick.style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}
joyEl.onpointerdown=e=>{joyEl.setPointerCapture(e.pointerId);joyMove(e)};joyEl.onpointermove=e=>{if(e.buttons)joyMove(e)};joyEl.onpointerup=joyEl.onpointercancel=()=>{joy.x=joy.y=0;stick.style.transform=''};

function project(wx,wz,y=0){let dz=wz-player.z+5;if(dz<1)return null;let scale=Math.min(2.4,420/dz),sx=W/2+(wx-player.x)*scale*3,ground=H*.88-(dz)*2.3,sy=ground-y*scale*5;return {x:sx,y:sy,s:scale,d:dz}}
function person(p,label,color,emoji){
  if(!p)return;let s=Math.max(.35,p.s),h=48*s,w=25*s;
  x.fillStyle=color;x.fillRect(p.x-w/2,p.y-h,w,h*.55);x.fillStyle='#244';x.fillRect(p.x-w*.35,p.y-h*.45,w*.25,h*.5);x.fillRect(p.x+w*.1,p.y-h*.45,w*.25,h*.5);
  x.font=`${Math.max(16,20*s)}px sans-serif`;x.textAlign='center';x.fillText(emoji,p.x,p.y-h-4);
  x.font=`bold ${Math.max(11,12*s)}px sans-serif`;x.fillStyle='#fff';x.strokeStyle='#111';x.lineWidth=3;x.strokeText(label,p.x,p.y-h-25*s);x.fillText(label,p.x,p.y-h-25*s)
}
function draw(){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7dceff');g.addColorStop(.65,'#d9f3ff');g.addColorStop(.651,'#78cf70');g.addColorStop(1,'#49a84d');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='#ffffff55';x.lineWidth=1;for(let z=5;z<75;z+=5){let a=project(-20,player.z+z),b=project(20,player.z+z);if(a&&b){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
 for(let xx=-20;xx<=20;xx+=4){let a=project(xx,player.z+3),b=project(xx,player.z+70);if(a&&b){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
 stars.forEach(st=>{if(st.got)return;let p=project(st.x,st.z,.8);if(p&&p.x>-30&&p.x<W+30){x.font=`${Math.max(15,18*p.s)}px sans-serif`;x.textAlign='center';x.fillText('⭐',p.x,p.y)}});
 let op=project(oni.x,oni.z,0);if(op)person(op,'👹 ONI','#e43b3b','👹');
 let pp={x:W/2,y:H*.88-player.y*35,s:1.25};person(pp,'YOU','#43a7ff','🙂');
}
function loop(t){
 if(!running)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;elapsed+=dt;inv=Math.max(0,inv-dt);
 let mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
 let mz=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-joy.y;
 let len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len}
 const ps=7.0;player.x+=mx*ps*dt;player.z+=mz*ps*dt;player.x=Math.max(-18,Math.min(18,player.x));player.z=Math.max(0,Math.min(80,player.z));
 player.vy-=18*dt;player.y+=player.vy*dt;if(player.y<0){player.y=0;player.vy=0}
 if(elapsed>=10){
   let dx=player.x-oni.x,dz=player.z-oni.z,d=Math.hypot(dx,dz)||1;
   let os=Math.min(6.2,4.35+elapsed/180);oni.x+=dx/d*os*dt;oni.z+=dz/d*os*dt;
   oniInfo.textContent=`👹 鬼まで ${Math.round(d)}m`;
   if(d<1.5&&inv<=0){life--;lifeEl.textContent=life;sfx(120,.45,'sawtooth');flash('👹 つかまった！');inv=3;oni.x=player.x+(Math.random()>.5?12:-12);oni.z=Math.min(78,player.z+15);if(life<=0)return end(false)}
 }else oniInfo.textContent=`👹 鬼スタートまで ${Math.ceil(10-elapsed)}秒`;
 stars.forEach(st=>{if(!st.got&&Math.hypot(player.x-st.x,player.z-st.z)<1.4){st.got=true;score+=100;scoreEl.textContent=score;sfx(880,.12);setTimeout(()=>sfx(1175,.12),80)}});
 timeEl.textContent=Math.max(0,Math.ceil(300-elapsed));if(elapsed>=300)return end(true);
 draw();requestAnimationFrame(loop)
}
function end(win){running=false;if(musicTimer)clearInterval(musicTimer);sfx(win?900:100,.6,win?'sine':'sawtooth');document.getElementById('start').style.display='flex';document.getElementById('start').innerHTML=`<div class="card"><h1>${win?'🎉 逃げ切った！':'👹 ゲームオーバー'}</h1><p>スコア：<b>${score}</b><br>${win?'5分間逃げ切りました！':'もう一度チャレンジしよう！'}</p><button id="restart">もう一度</button></div>`;document.getElementById('restart').onclick=()=>location.reload()}
draw();
</script>
</body>
</html>
